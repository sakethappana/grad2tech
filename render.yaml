# Render Blueprint: managed PostgreSQL + web service + background worker.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
databases:
  - name: grad2tech-db
    plan: basic-256mb
    databaseName: grad2tech
    user: grad2tech
    postgresMajorVersion: "17"

services:
  - type: web
    name: grad2tech-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /portal
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: grad2tech-db, property: connectionString }
      - key: APP_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        sync: false
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
      - key: JUDGE0_RAPIDAPI_HOST
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEBCONTAINER_CLIENT_ID
        sync: false

  - type: worker
    name: grad2tech-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: grad2tech-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
      - key: JUDGE0_RAPIDAPI_HOST
        sync: false
